# Solo el servidor PostgreSQL. El esquema, los datos iniciales y las migraciones
# se cargan con `npm run db:setup` (ver database/README.md), que registra cada
# migración aplicada y así no se repite ninguna.
services:
  postgres:
    image: postgres:15-alpine
    container_name: titulacion_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: sistema_titulacion
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
