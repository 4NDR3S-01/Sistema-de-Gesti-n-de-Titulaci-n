version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: titulacion_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sistema_titulacion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
      - ./database/migrations/004_pat2_tribunales.sql:/docker-entrypoint-initdb.d/03_pat2_tribunales.sql
      - ./database/migrations/006_pat2_grupal_firmas.sql:/docker-entrypoint-initdb.d/04_pat2_grupal_firmas.sql

volumes:
  postgres_data:
